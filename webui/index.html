<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RealEstate Edit — T.D.I Lab</title>
<style>
:root{--bg:#0a0e1a;--card:#121829;--border:rgba(148,163,184,.16);--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:22px}
h1{font-size:30px;letter-spacing:.03em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:34px;text-align:center;color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--accent);color:var(--accent)}
button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
img.preview{max-width:100%;border-radius:10px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tag{font-family:ui-monospace,monospace;font-size:12px;color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
select,input[type=text]{width:100%;background:#0d1322;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:13px}
.status{font-size:12px;font-family:ui-monospace,monospace;margin-top:8px;color:var(--muted);min-height:16px}
</style>
</head>
<body>
<h1>REAL<span>ESTATE</span> EDIT</h1>
<div class="sub">T.D.I Lab — sky · grass · color profiles. Rust engine (instant) + Qwen-Image 2.1 AI (ComfyUI :8188)</div>

<div class="grid2">
  <div class="card">
    <div id="drop" class="drop">drop a photo here or click to browse<input id="file" type="file" accept="image/*" hidden></div>
    <div style="margin-top:10px"><img id="before" class="preview" hidden></div>
  </div>
  <div class="card">
    <div style="min-height:200px;display:flex;align-items:center;justify-content:center;color:var(--muted)" id="after-ph">result appears here</div>
    <img id="after" class="preview" hidden>
    <div class="status" id="status">idle</div>
    <a id="dl" hidden><button class="pri" style="margin-top:8px">⬇ Download result</button></a>
  </div>
</div>

<div class="row" style="margin-top:14px">
  <div class="card" style="flex:1;min-width:280px">
    <b style="font-size:13px">☀️ Brightness (instant)</b>
    <label>brightness <span id="brval">+0.3</span></label>
    <input type="range" id="brightness" min="-100" max="100" value="30" style="width:100%">
    <button class="pri" style="margin-top:10px" onclick="brighten()">Apply brightness</button>
  </div>
  <div class="card" style="flex:1;min-width:280px">
    <b style="font-size:13px">⚡ Color Profiles (Rust engine — instant)</b>
    <label>preset</label>
    <select id="preset"></select>
    <button class="pri" style="margin-top:10px" onclick="grade()">Apply profile</button>
  </div>
  <div class="card" style="flex:1;min-width:280px">
    <b style="font-size:13px">🤖 AI Edit (Qwen-Image 2.1 — sky / grass / declutter)</b>
    <label>engine</label>
    <select id="aiengine"><option value="auto">auto (local ComfyUI → cloud fallback)</option><option value="cloud:glm-cloud">GLM Cloud (needs REALESTATE_GLM_API_KEY)</option><option value="cloud:custom">Custom endpoint (env vars)</option></select>
    <label>mode</label>
    <select id="aimode"></select>
    <label>custom prompt (used when mode = custom)</label>
    <input type="text" id="aiprompt" placeholder="e.g. replace sky with dramatic sunset">
    <button class="pri" style="margin-top:10px" onclick="aiedit()">Run AI edit</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
